; godot_export_presets.cfg (M3.10 t-code-02 .pck 拆分模板)
; 用途: Godot 4.3 Web export 配置,t-code-02 .pck 拆分基线
; 说明:
;   - Godot 4.3 不官方支持多 .pck 导出,本配置先导出一个完整 .pck
;   - 然后由 post-export 脚本(gdscript-template/split-pck.mjs)按文件名/路径分类拆
;   - 拆完后 main.pck 计入 firstChunk,其它 .pck 按需加载
; 真实集成: 工程团队 PR 跑通,沙箱内只能验证拆包脚本

[preset.0]
name="Wildwood Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="tcode02_pck_split"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_site_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
; vram_texture_compression 不勾选,首屏 PNG 直读
; texture_format/s3tc_bptc=true 让 GPU 直接吃,但增加 first chunk
; 权衡: 不勾选,加载时 CPU 解码

; ===== t-code-02 拆分元数据 =====
; post-export 脚本读 custom_features 字符串判 t-code-02 是否启用
; 拆包时按以下规则分:
;   - lobby/, ui/lobby/      → main.pck
;   - center/                → main.pck
;   - biomes/{current}       → main.pck (current 在 build 时由项目设置注入)
;   - biomes/{other}         → biome_<name>.pck
;   - seasons/{other}        → season_<name>.pck
;   - 其它                   → main.pck
; 详细规则见 design/t-code-02-pck-split-design.md
