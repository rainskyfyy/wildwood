# .github/workflows/perf-ci.yml
# M3.10 性能 CI：build + lhci + bundle + aseprite-32px
name: perf-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Aseprite CLI
        uses: dawidd6/action-aseprite@v3
        with:
          version: 1.3.7

      - name: Install deps
        run: npm ci

      - name: Build Godot WebGL (export preset: Web)
        run: npm run build:web

      - name: Aseprite 32px grid check
        run: node scripts/aseprite-32px-check.mjs ./assets

      - name: Bundle analysis
        run: node scripts/bundle-analyze.mjs ./build/web

      - name: Lighthouse CI (3 runs median, desktop preset)
        run: |
          npx -y @lhci/cli@0.13.x autorun \
            --config=./lighthouserc.js \
            --collect.numberOfRuns=3 \
            --upload.target=temporary-public-storage

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
