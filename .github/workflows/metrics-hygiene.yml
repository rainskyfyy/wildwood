name: Metrics Hygiene Check

on:
  push:
    branches: [main, feat/v0.8.0d-metrics-hygiene]
    paths:
      - 'update_roadmap.py'
      - 'sync_roadmap.py'
      - 'sync_main.py'
      - 'tools/check-metrics-hygiene.py'
      - 'tools/metrics_helpers.py'
      - 'tools/startup_check.py'
      - '.github/workflows/metrics-hygiene.yml'
  pull_request:
    paths:
      - '*.py'
      - 'tools/**/*.py'
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          # 无第三方依赖,纯 stdlib
          python3 --version

      - name: 运行 metrics hygiene CI 校验
        id: check
        run: |
          python3 tools/check-metrics-hygiene.py
        continue-on-error: true

      - name: 上传诊断报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-hygiene-report
          path: |
            tools/metrics-hygiene-report.json
          retention-days: 7

      - name: 报告检查结果
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::metrics hygiene check 发现不合规写入点,详见上方输出"
          echo "请检查以下规则:"
          echo "  1. 每条 metric 必须带 source=<script_name> 字段"
          echo "  2. 每条 metric 必须带 schema_version 字段(当前 1.0)"
          echo "  3. append-only:必须用 'a' 模式打开文件,禁止 'w'"
          echo "  4. 路径:必须写 metrics/<script>.jsonl,不要写共享文件"
          echo "  5. 必须实现 fixture 过滤(EXCLUDED_SOURCES / EXCLUDED_ERROR_TOKENS)"
          exit 1

      - name: 检查通过
        if: steps.check.outcome == 'success'
        run: |
          echo "✓ Metrics hygiene 全部合规,CI 通过"
