name: Test

on:
  push:
    branches: [main, develop, feature/**, m1.**]
  pull_request:
    branches: [main, develop]

jobs:
  unit-and-integration:
    name: GUT + Godot integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          include-export-templates: false

      - name: Cache GUT
        id: cache-gut
        uses: actions/cache@v4
        with:
          path: addons/gut
          key: gut-v9.2.0
          restore-keys: |
            gut-

      - name: Install GUT
        if: steps.cache-gut.outputs.cache-hit != 'true'
        run: bash tests/scripts/install_gut.sh

      - name: Run unit tests (GUT)
        env:
          GODOT_BIN: godot
        run: bash tests/scripts/run_unit.sh

      - name: Run integration tests
        env:
          GODOT_BIN: godot
        run: bash tests/scripts/run_integration.sh

      - name: Upload GUT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: test_results/

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright
        working-directory: tests/e2e
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
