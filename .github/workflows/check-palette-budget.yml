name: check-palette-budget

on:
  push:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - 'tools/check-palette-budget.py'
      - '.github/workflows/check-palette-budget.yml'
      - 'assets/art/biomes/**'
      - 'assets/biomes/**'
  pull_request:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - 'tools/check-palette-budget.py'
      - '.github/workflows/check-palette-budget.yml'
      - 'assets/art/biomes/**'
      - 'assets/biomes/**'
  workflow_dispatch:  # 允许手动触发 (审计现有仓库时使用)

jobs:
  check-budget:
    name: 校验 5 群系调色板预算
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 PIL 依赖
        run: pip install pillow

      - name: 跑 24 色硬约束检查
        id: check
        run: |
          python3 tools/check-palette-budget.py --json > /tmp/budget-result.json
          cat /tmp/budget-result.json

      - name: 严格模式审计 (暖色占比硬约束)
        id: check-strict
        # 严格模式只在 main 分支 + 手动触发时跑, PR 跑基础模式
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/check-palette-budget.py --strict --json > /tmp/budget-strict.json
          cat /tmp/budget-strict.json

      - name: 检查结果
        if: steps.check.outcome == 'failure' || steps.check-strict.outcome == 'failure'
        run: |
          echo "❌ 调色板预算 CI 失败"
          exit 1
