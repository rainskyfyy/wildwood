name: check-palette-budget

on:
  push:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - 'tools/check-palette-budget.py'
      - '.github/workflows/check-palette-budget.yml'
      - 'assets/art/biomes/**'
      - 'assets/biomes/**'
  pull_request:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - 'tools/check-palette-budget.py'
      - '.github/workflows/check-palette-budget.yml'
      - 'assets/art/biomes/**'
      - 'assets/biomes/**'
  workflow_dispatch:  # 允许手动触发 (审计现有仓库时使用)

jobs:
  check-budget:
    name: 校验 5 群系调色板预算
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 PIL 依赖
        run: pip install pillow

      - name: 跑 24 色硬约束检查
        id: check
        # 基础模式 exit 2 是 warm advisory(非硬约束), 不标记 job failure;
        # 真正结果由下方"检查结果"步骤依据 budget_pass 判定
        continue-on-error: true
        run: |
          python3 tools/check-palette-budget.py --json > /tmp/budget-result.json
          cat /tmp/budget-result.json

      - name: 严格模式审计 (暖色占比硬约束)
        id: check-strict
        # 严格模式只在 main 分支 + 手动触发时跑, PR 跑基础模式
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/check-palette-budget.py --strict --json > /tmp/budget-strict.json
          cat /tmp/budget-strict.json

      - name: 检查结果
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          ok = True
          # 基础模式 (PR): 仅 24 色硬约束判定, warm advisory 不阻断
          try:
            d = json.load(open('/tmp/budget-result.json'))
            for biome, r in d.items():
              if r.get('files_n', 0) > 0 and not r.get('budget_pass', True):
                print(f"FAIL {biome}: {r.get('unique_colors')} 色 > 24 硬约束"); ok = False
              elif r.get('files_n', 0) > 0:
                warm = r.get('warm_pct', 0); target = r.get('warm_target', '?')
                print(f"OK {biome}: {r.get('unique_colors')} 色 (warm {warm}% target {target})")
          except Exception as e:
            print("无法解析 budget-result.json:", e); ok = False
          # 严格模式 (main/manual): warm 也判定
          if os.path.exists('/tmp/budget-strict.json'):
            try:
              d2 = json.load(open('/tmp/budget-strict.json'))
              for biome, r in d2.items():
                if r.get('files_n', 0) > 0 and not r.get('warm_pass', True):
                  print(f"STRICT FAIL {biome}: warm {r.get('warm_pct')}% 不达 {r.get('warm_target')}"); ok = False
            except Exception as e:
              print("无法解析 budget-strict.json:", e); ok = False
          print("✅ 调色板预算 CI 通过" if ok else "❌ 调色板预算 CI 失败")
          exit(0 if ok else 1)
