name: check-palette-gitignore

on:
  push:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - '.gitignore'
      - 'tools/check-palette-gitignore.py'
      - '.github/workflows/check-palette-gitignore.yml'
  pull_request:
    branches: [main, 'feat/v0.*', 'fix/v0.*']
    paths:
      - '.gitignore'
      - 'tools/check-palette-gitignore.py'
      - '.github/workflows/check-palette-gitignore.yml'
  workflow_dispatch:  # 允许手动触发 (审计现有仓库时使用)

jobs:
  check-gitignore:
    name: 校验 .gitignore 覆盖
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要历史, 用来检测已跟踪的污染源

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 check-palette-gitignore.py
        id: check
        run: |
          python3 tools/check-palette-gitignore.py --json > /tmp/check-result.json
          cat /tmp/check-result.json

      - name: 严格模式审计 (历史污染扫描)
        id: check-strict
        # 严格模式只在 main 分支 + 手动触发时跑, PR 跑基础模式
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/check-palette-gitignore.py --strict --json > /tmp/check-strict.json
          cat /tmp/check-strict.json

      - name: 检查结果
        if: steps.check.outcome == 'failure' || steps.check-strict.outcome == 'failure'
        run: |
          echo "::error::.gitignore 校验失败, 缺失必需条目"
          echo "请在 .gitignore 中补齐缺失项, 参考 tools/check-palette-gitignore.py 的 REQUIRED_ENTRIES"
          exit 1
