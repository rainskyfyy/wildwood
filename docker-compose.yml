## Wildwood M1.9 — docker-compose
##
## 一键起一个房间服务(开发用),M3.7-3.8 替换为生产编排(k8s / swarm)
##
## 用法:
##   docker compose up --build
##   # 另一窗口
##   curl http://localhost:8080/health
##   # {"status":"ok","conn_count":0,...}
##   wscat -c ws://localhost:8080/ws
##
## 端口:
##   8080  HTTP + WebSocket 入口
##         (env ROOMSERVER_ADDR=:8080 覆盖)
##
## 调优:
##   - tick:    服务端 tick 频率(Hz),默认 20
##   - max-conn: 单进程允许的最大并发连接数,默认 1000

services:
  roomserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: wildwood/roomserver:dev
    container_name: wildwood-roomserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ROOMSERVER_ADDR: ":8080"
      ROOMSERVER_TICK: "20"
      ROOMSERVER_MAX_CONN: "1000"
      GIN_MODE: "release"
    healthcheck:
      # distroless 没有 shell/wget,改用 Go 自带端点;
      # 容器内直连 loopback 8080 端口, /health 期望 200
      test: ["CMD", "/app/roomserver", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # 资源限制(M1.9 单进程 200 房间压测峰值 ~150MB heap;留 512MB 余量)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 64M
    # 安全:只读根 fs(临时目录除外)
    read_only: true
    tmpfs:
      - /tmp
    # 安全:不获得新权限 + 限制 cap
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
