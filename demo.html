<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Wildwood M2.10c Demo — 资源系统 + 铲 + 重生 + 耐久</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg: #0d0d18; --fg: #f0f0f0; --accent: #d4a64a; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; height: 100%; }
    h1 { font-size: 18px; font-weight: 600; margin: 0; color: var(--accent); letter-spacing: 0.5px; }
    .stage {
      position: relative; width: 960px; max-width: 100%;
      aspect-ratio: 4 / 3;
      box-shadow: 0 6px 30px rgba(0,0,0,0.5); border: 2px solid #2a2a3a; border-radius: 6px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; background: #1a1a2a;
             image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges;
             cursor: crosshair; }
    .controls { font-size: 12px; color: #aaa; display: flex; gap: 16px; flex-wrap: wrap;
                max-width: 960px; justify-content: center; }
    .controls kbd { background: #2a2a3a; border: 1px solid #444; border-radius: 3px; padding: 1px 6px;
                   font-family: ui-monospace, monospace; font-size: 11px; color: #fff; }
    .badge { display: inline-block; padding: 1px 6px; background: #2a3a2a; color: #7ec47e;
             border: 1px solid #4a6a4a; border-radius: 3px; font-size: 10px; margin-left: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wildwood · M2.10c 资源系统 + 铲 + 重生 + 耐久</h1>
    <div class="stage">
      <canvas id="game" width="960" height="720"></canvas>
    </div>
    <div class="controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
      <span><kbd>1</kbd>~<kbd>6</kbd> 切快捷栏</span>
      <span><kbd>左键</kbd> 采集资源</span>
      <span><kbd>I</kbd> 背包 · <kbd>C</kbd> 合成 · <kbd>Esc</kbd> 关闭</span>
      <span>斧/镐/铲耐久度:绿>50% 琥珀>20% 红≤20%</span>
      <span>铲:挖土堆/树苗/胡萝卜 · 蘑菇可用铲或徒手<span class="badge">M2.10c</span></span>
      <span>砍/挖完后 30-240s 后重生(随机化种子)<span class="badge">M2.10b</span></span>
    </div>
  </div>
  <script type="module">
    import { bootGame } from './src/main.js';
    const canvas = document.getElementById('game');
    const game = bootGame(canvas);
    window.__wildwood = { canvas, game };
  </script>
</body>
</html>
