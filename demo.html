<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Wildwood M2.12 — 5Hz 状态同步 HUD(替换 M4 Canvas 绘制)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- M1.7 UI 基础布局(tokens 必须先于其他) -->
  <link rel="stylesheet" href="./src/ui/layout/tokens.css">
  <link rel="stylesheet" href="./src/ui/layout/grid.css">
  <link rel="stylesheet" href="./src/ui/layout/anchors.css">
  <!-- M1.8 UI 组件库(6 类 × 3 变体) -->
  <link rel="stylesheet" href="./src/ui/components/components.css">
  <style>
    :root {
      --bg: #0d0d18;
      --fg: #f0f0f0;
      --accent: #d4a64a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px; height: 100%;
    }
    h1 {
      font-size: 18px; font-weight: 600; margin: 0;
      color: var(--accent); letter-spacing: 0.5px;
    }
    /* M1.7: 视口 1440×900 · 16:10 · 中央净空区留出 5 锚定区 */
    .stage {
      position: relative;
      width: 1440px;
      max-width: calc(100vw - 24px);
      aspect-ratio: 16 / 10;            /* 1440:900 = 16:10 */
      box-shadow: 0 6px 30px rgba(0,0,0,0.5);
      border: 2px solid #2a2a3a;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1a2a;
    }
    canvas#game {
      display: block; width: 100%; height: 100%;
      background: #1a1a2a;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .controls {
      font-size: 12px; color: #aaa;
      display: flex; gap: 16px; flex-wrap: wrap;
      max-width: 1440px; justify-content: center;
    }
    .controls kbd {
      background: #2a2a3a; border: 1px solid #444;
      border-radius: 3px; padding: 1px 6px;
      font-family: ui-monospace, monospace; font-size: 11px;
      color: #fff;
    }
    /* M2.12 队伍槽 36×36 内部文字(基础类已有) */
    .PartySlot-Name {
      position: absolute; bottom: 2px; left: 2px; right: 2px;
      font-family: var(--font-pixel);
      font-size: var(--fs-10);
      color: var(--fg);
      text-shadow: 1px 1px 0 var(--night-black);
      text-align: center;
      line-height: 1;
      letter-spacing: 0.5px;
    }
    .PartySlot-Id {
      position: absolute; top: 1px; right: 1px;
      font-family: var(--font-pixel);
      font-size: var(--fs-10);
      color: var(--fg-faint);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wildwood · M4 引擎 + M1.7/M1.8 UI + M2.12 5Hz 状态同步</h1>
    <div class="stage">
      <canvas id="game" width="1440" height="900"></canvas>
      <!-- M1.7 + M1.8 + M2.12: 5 锚定区填上实际组件实例 + 队伍槽 + 三围条/小地图/快捷栏/聊天 -->
      <div class="UILayer">

        <!-- 左上 · 4 队伍槽 + 3 三围条 -->
        <div class="Anchor-TL">
          <div class="GridRow GridGap-8">
            <div class="PartySlot" data-party-color="party-1"></div>
            <div class="PartySlot" data-party-color="party-2"></div>
            <div class="PartySlot" data-party-color="party-3"></div>
            <div class="PartySlot" data-party-color="party-4"></div>
          </div>
          <div class="VitalBar VitalBar-HP" data-value="100">
            <div class="VitalBar-Fill" style="width: 100%"></div>
            <div class="VitalBar-Value">100/100</div>
          </div>
          <div class="VitalBar VitalBar-Hunger" data-value="80">
            <div class="VitalBar-Fill" style="width: 80%"></div>
            <div class="VitalBar-Value">80/100</div>
          </div>
          <div class="VitalBar VitalBar-Sanity" data-value="100">
            <div class="VitalBar-Fill" style="width: 100%"></div>
            <div class="VitalBar-Value">100/100</div>
          </div>
        </div>

        <!-- 右上 · 时间 + 季节 -->
        <div class="Anchor-TR">
          <div class="TimeDisplay">Day 12 · 14:32</div>
          <div class="SeasonTag">AUTUMN</div>
        </div>

        <!-- 右下 · 小地图 200×200 -->
        <div class="Anchor-BR">
          <div class="Minimap">
            <canvas class="MinimapCanvas" width="200" height="200"></canvas>
            <div class="Minimap-PlayerDot"></div>
            <div class="Minimap-PartyDot Minimap-PartyDot-Party-2" style="top: 30%; left: 40%"></div>
            <div class="Minimap-PartyDot Minimap-PartyDot-Party-3" style="top: 65%; left: 70%"></div>
            <div class="Minimap-POIDot" style="top: 20%; left: 80%"></div>
            <div class="Minimap-Compass">
              <span class="Minimap-Compass-N">N</span>
              <span class="Minimap-Compass-S">S</span>
              <span class="Minimap-Compass-E">E</span>
              <span class="Minimap-Compass-W">W</span>
            </div>
          </div>
        </div>

        <!-- 左下 · 快捷栏 5 格 + 2 扩展(共 7) -->
        <div class="Anchor-BL">
          <div class="HotbarSlot HotbarSlot-Default">
            <span class="HotbarSlot-Key">1</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Active">
            <span class="HotbarSlot-Key">2</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Default">
            <span class="HotbarSlot-Key">3</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Default">
            <span class="HotbarSlot-Key">4</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Default">
            <span class="HotbarSlot-Key">5</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Disabled" aria-disabled="true">
            <span class="HotbarSlot-Key">6</span>
          </div>
          <div class="HotbarSlot HotbarSlot-Disabled" aria-disabled="true">
            <span class="HotbarSlot-Key">7</span>
          </div>
        </div>

        <!-- 底部 · 聊天 -->
        <div class="Anchor-B">
          <div class="ChatChannel-Tab">
            <span class="Active">[全局]</span>
            <span>[队伍]</span>
            <span>[私聊]</span>
          </div>
          <div class="ChatLine">[系统] Day 12 · 落叶渐红,寒意将至</div>
          <div class="ChatLine">[玩家A] 那边有棵树可以砍伐</div>
          <div class="ChatLine">[玩家B] 我去收集石头</div>
          <input class="ChatInput" type="text" placeholder="按 Enter 发送消息...">
        </div>

      </div>
    </div>
    <div class="controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑↓←→</kbd> 移动</span>
      <span><kbd>1</kbd>~<kbd>5</kbd> 切快捷栏</span>
      <span>M2.12 · 5Hz 状态同步 · EventTarget 总线 · 4 队伍槽 mock · M4 引擎共存</span>
    </div>
  </div>

  <!-- M2.12: 顶层 HUD 状态机(EventTarget 总线 + 5Hz tick + 4 队伍槽 mock) -->
  <script src="./src/ui/hud.js"></script>
  <!-- M4 引擎 + src/hud/ 改造后的 DOM 版(替换原 Canvas 绘制) -->
  <script type="module">
    import { bootGame } from './src/main.js';
    const canvas = document.getElementById('game');
    bootGame(canvas);
    // 暴露给调试 + M2.11 图鉴系统
    window.__wildwood = { canvas, bus: window.__hudBus, ready: () => window.__hudReady === true };
  </script>
</body>
</html>
