// =====================================================================
// Wildwood 网络协议语义层 — 公共类型 (M1.5)
//
// 设计原则:
//   1. transport-agnostic: 不绑 WebSocket/UDP/QUIC,由传输层(M1.9+)承载
//   2. 字段编号一旦发布不变(v1 锁定,改字段=加新字段号+废弃旧)
//   3. A/B 通用:只用 protobuf 标准类型,不依赖任何引擎 API
//   4. 字节序:protobuf wire format 已规定,大端 varint
//   5. 帧大小预算:< 4 KB/tick(对应方案 §3.4 "同步包大小 < 4 KB/tick")
//
// 命名约定: C2S_* = 客户端→服务端, S2C_* = 服务端→客户端
// =====================================================================
syntax = "proto3";

package wildwood.net.v1;

option go_package = "github.com/wildwood/net/proto/v1;wildwoodv1";

// -------------------- 枚举:错误码 --------------------

enum RoomErrorCode {
  ROOM_ERROR_UNSPECIFIED = 0;       // 占位,protocol 强制 0 = 未指定
  ROOM_ERROR_FULL         = 1;      // 4 人满员(M1.11 硬约束)
  ROOM_ERROR_NOT_FOUND    = 2;      // room_id 不存在
  ROOM_ERROR_ALREADY_MEMBER = 3;    // 已在房间内
  ROOM_ERROR_VERSION_MISMATCH = 4;  // 协议版本不匹配
  ROOM_ERROR_KICKED       = 5;      // 被房主踢出
  ROOM_ERROR_ROOM_CLOSED  = 6;      // 房间已关闭
  ROOM_ERROR_INVALID_INPUT = 7;     // 服务端校验拒绝(防作弊,M3.8 预备)
  ROOM_ERROR_RATE_LIMITED = 8;      // 输入频率超限
}

// -------------------- 枚举:聊天频道 --------------------

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_GLOBAL      = 1;    // 全服(若有)
  CHAT_CHANNEL_TEAM        = 2;    // 4 人小队
  CHAT_CHANNEL_PRIVATE     = 3;    // 私聊
}

// -------------------- 枚举:输入动作 --------------------

enum InputAction {
  INPUT_ACTION_UNSPECIFIED = 0;
  INPUT_ACTION_MOVE        = 1;    // move_dx/dy
  INPUT_ACTION_ATTACK      = 2;    // target_entity_id
  INPUT_ACTION_GATHER      = 3;    // target_entity_id (资源)
  INPUT_ACTION_BUILD       = 4;    // target_prefab_id + tile_x/y
  INPUT_ACTION_USE_ITEM    = 5;    // slot_index + target_entity_id
  INPUT_ACTION_RESPAWN     = 6;    // 鬼魂态复活请求
  INPUT_ACTION_INTERACT    = 7;    // NPC / 门 / 工作台
}

// -------------------- 枚举:实体类型 --------------------

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER      = 1;
  ENTITY_KIND_MONSTER     = 2;     // 树精/蜘蛛/蝙蝠/猎犬/鱼人/巨鹿
  ENTITY_KIND_RESOURCE    = 3;     // 树/矿/草/浆果/蘑菇...
  ENTITY_KIND_BUILDING    = 4;     // 营火/箱子/工作台/烹饪锅
  ENTITY_KIND_PROJECTILE  = 5;     // 投掷物(M2.x 扩展)
  ENTITY_KIND_NPC         = 6;     // 商人/学者/老人
}

// -------------------- 枚举:世界事件类型 --------------------

enum WorldEventKind {
  WORLD_EVENT_UNSPECIFIED   = 0;
  WORLD_EVENT_GATHER_DONE   = 1;    // 资源被采完
  WORLD_EVENT_BUILD_DONE    = 2;    // 建筑完成
  WORLD_EVENT_ATTACK_HIT    = 3;    // 攻击命中
  WORLD_EVENT_DAMAGE_TAKEN  = 4;    // 受伤
  WORLD_EVENT_DEATH         = 5;    // 死亡
  WORLD_EVENT_RESPAWN       = 6;    // 复活
  WORLD_EVENT_KNOCKBACK     = 7;    // 击退
}

// -------------------- 公共消息结构 --------------------

// 二维浮点位置/向量(32px 网格坐标系,米=32px)
message Vec2F {
  float x = 1;
  float y = 2;
}

// 玩家状态快照(供世界 delta / 队伍列表复用)
message PlayerState {
  string player_id   = 1;          // 服务端 UUID
  string player_name = 2;          // 显示名(≤ 24 字符)
  Vec2F  position    = 3;
  float  facing      = 4;          // 朝向 0-2π
  uint32 color_rgb   = 5;          // 玩家队伍颜色 0xRRGGBB
  bool   is_alive    = 6;
}

// 通用实体状态(玩家/怪物/资源/建筑统一表达)
message EntityState {
  uint32    entity_id     = 1;     // 服务端分配的唯一 id(房间内)
  EntityKind kind         = 2;
  Vec2F     position      = 3;
  float     facing        = 4;
  uint32    hp            = 5;     // 当前 HP
  uint32    max_hp        = 6;     // 最大 HP
  uint32    prefab_id     = 7;     // 树精=1, 浆果=2, 营火=20 ...(M2.x 表)
  string    player_id     = 8;     // 仅玩家:对应 PlayerState.player_id
}

// 玩家状态条(只给百分比,隐藏具体数值,符合方案 §5.4)
message PlayerStatus {
  string player_id        = 1;
  uint32 hp_pct           = 2;     // 0-100
  uint32 hunger_pct       = 3;     // 饱腹
  uint32 sanity_pct       = 4;     // 精神
  uint32 temp_pct         = 5;     // 温度
  bool   is_alive         = 6;
  bool   is_ghost         = 7;     // 鬼魂态 10s 复活窗口
  uint32 ghost_remaining_ms = 8;   // 鬼魂倒计时(毫秒)
}

// 世界事件(伤害/采集完成/死亡/复活/...)
message WorldEvent {
  uint32         event_id       = 1;  // 房间内唯一
  WorldEventKind event_kind     = 2;
  uint32         source_entity_id = 3;  // 施放者(0 = 环境)
  uint32         target_entity_id = 4;  // 承受者(0 = 全体)
  sint32         amount         = 5;  // 伤害/采集量(可负)
  Vec2F          position       = 6;
}

// 完整世界快照(房间加入时一次下发,M3.x 增量优化后改 delta)
message WorldSnapshot {
  uint32              server_tick    = 1;
  uint64              server_time_ms = 2;
  repeated EntityState entities     = 3;
  repeated PlayerState players      = 4;
  repeated PlayerStatus status      = 5;
  string              world_seed    = 6;  // 字符串形式 seed(跨语言安全)
  string              season        = 7;  // spring/summer/autumn/winter
  uint32              day           = 8;  // 1-30
}
